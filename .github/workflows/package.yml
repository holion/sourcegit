name: Package
on:
  workflow_call:
    inputs:
      version:
        description: SourceGit package version
        required: true
        type: string
      ref:
        description: Commit to check out. Defaults to the commit that triggered the workflow.
        required: false
        type: string
      runtimes:
        description: Comma-separated runtimes to package. Falls back to the BUILD_RUNTIMES repository variable, then osx-arm64.
        required: false
        type: string
jobs:
  select:
    name: Select runtimes
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.select.outputs.windows }}
      osx: ${{ steps.select.outputs.osx }}
      linux: ${{ steps.select.outputs.linux }}
    steps:
      - name: Select runtimes
        id: select
        env:
          RUNTIMES: ${{ inputs.runtimes || vars.BUILD_RUNTIMES || 'osx-arm64' }}
        run: |
          pick() {
            jq -cn --arg want "$RUNTIMES" --arg prefix "$1" '$want | split(",") | map(gsub("\\s"; "")) | map(select(startswith($prefix)))'
          }
          echo "windows=$(pick win-)" >> "$GITHUB_OUTPUT"
          echo "osx=$(pick osx-)" >> "$GITHUB_OUTPUT"
          echo "linux=$(pick linux-)" >> "$GITHUB_OUTPUT"
  windows:
    name: Package Windows
    needs: select
    if: needs.select.outputs.windows != '[]'
    runs-on: windows-2022
    strategy:
      matrix:
        runtime: ${{ fromJSON(needs.select.outputs.windows) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: sourcegit.${{ matrix.runtime }}
          path: build/SourceGit
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          RUNTIME: ${{ matrix.runtime }}
        run: ./build/scripts/package.win.ps1
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package.${{ matrix.runtime }}
          path: build/sourcegit_*.zip
      - name: Delete temp artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: sourcegit.${{ matrix.runtime }}
  osx-app:
    name: Package macOS
    needs: select
    if: needs.select.outputs.osx != '[]'
    runs-on: macos-latest
    strategy:
      matrix:
        runtime: ${{ fromJSON(needs.select.outputs.osx) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: sourcegit.${{ matrix.runtime }}
          path: build
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
          RUNTIME: ${{ matrix.runtime }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir build/SourceGit
          tar -xf "build/sourcegit.${{ matrix.runtime }}.tar" -C build/SourceGit
          ./build/scripts/package.osx-app.sh
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package.${{ matrix.runtime }}
          path: |
            build/sourcegit_*.zip
            build/SourceGit-mac-*.dmg
      - name: Delete temp artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: sourcegit.${{ matrix.runtime }}
  linux:
    name: Package Linux
    needs: select
    if: needs.select.outputs.linux != '[]'
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    strategy:
      matrix:
        runtime: ${{ fromJSON(needs.select.outputs.linux) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Download package dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
          apt-get update
          apt-get install -y curl wget git dpkg-dev fakeroot tzdata zip unzip desktop-file-utils rpm libfuse2 file build-essential binutils
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: sourcegit.${{ matrix.runtime }}
          path: build
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
          RUNTIME: ${{ matrix.runtime }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir build/SourceGit
          tar -xf "build/sourcegit.${{ matrix.runtime }}.tar" -C build/SourceGit
          ./build/scripts/package.linux.sh
      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package.${{ matrix.runtime }}
          path: |
            build/sourcegit-*.AppImage
            build/sourcegit_*.deb
            build/sourcegit-*.rpm
      - name: Delete temp artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: sourcegit.${{ matrix.runtime }}
