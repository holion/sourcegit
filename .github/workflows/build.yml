name: Build
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out. Defaults to the commit that triggered the workflow.
        required: false
        type: string
      runtimes:
        description: Comma-separated runtimes to build. Falls back to the BUILD_RUNTIMES repository variable, then osx-arm64.
        required: false
        type: string
jobs:
  select:
    name: Select runtimes
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - name: Select runtimes
        id: select
        env:
          RUNTIMES: ${{ inputs.runtimes || vars.BUILD_RUNTIMES || 'osx-arm64' }}
        run: |
          ALL='[
            {"name": "Windows x64", "os": "windows-2022", "runtime": "win-x64"},
            {"name": "Windows ARM64", "os": "windows-2022", "runtime": "win-arm64"},
            {"name": "macOS (Intel)", "os": "macos-15-intel", "runtime": "osx-x64"},
            {"name": "macOS (Apple Silicon)", "os": "macos-latest", "runtime": "osx-arm64"},
            {"name": "Linux", "os": "ubuntu-latest", "runtime": "linux-x64", "container": "ubuntu:20.04"},
            {"name": "Linux (arm64)", "os": "ubuntu-latest", "runtime": "linux-arm64", "container": "ubuntu:20.04"}
          ]'
          echo "include=$(jq -c --arg want "$RUNTIMES" '($want | split(",") | map(gsub("\\s"; ""))) as $w | map(select(.runtime as $r | $w | index($r)))' <<< "$ALL")" >> "$GITHUB_OUTPUT"
  build:
    needs: select
    if: needs.select.outputs.include != '[]'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.select.outputs.include) }}
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    steps:
      - name: Install common CLI tools
        if: startsWith(matrix.runtime, 'linux-')
        run: |
          export DEBIAN_FRONTEND=noninteractive
          ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
          apt-get update
          apt-get install -y sudo
          sudo apt-get install -y curl wget git unzip zip libicu66 tzdata clang
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Configure arm64 packages
        if: matrix.runtime == 'linux-arm64'
        run: |
          sudo dpkg --add-architecture arm64
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ focal main restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ focal-updates main restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ focal-backports main restricted' \
          | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo sed -i -e 's/^deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
          sudo sed -i -e 's/^deb mirror/deb [arch=amd64] mirror/g' /etc/apt/sources.list
      - name: Install cross-compiling dependencies
        if: matrix.runtime == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm gcc-aarch64-linux-gnu
      - name: Build
        run: dotnet build -c Release
      - name: Publish
        run: dotnet publish src/SourceGit.csproj -c Release -o publish -r ${{ matrix.runtime }}
      - name: Rename executable file
        if: startsWith(matrix.runtime, 'linux-')
        run: mv publish/SourceGit publish/sourcegit
      - name: Tar artifact
        if: startsWith(matrix.runtime, 'linux-') || startsWith(matrix.runtime, 'osx-')
        run: |
          tar -cvf "sourcegit.${{ matrix.runtime }}.tar" -C publish .
          rm -r publish/*
          mv "sourcegit.${{ matrix.runtime }}.tar" publish
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sourcegit.${{ matrix.runtime }}
          path: publish/*
